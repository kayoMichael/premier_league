[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "premier_league"
dynamic = ["version"]
description = "Premier League Data Analysis Package"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Michael Li" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28.1",
    "requests-cache>=1.2.1",
    "lxml>=5.3.1",
    "beautifulsoup4>=4.12.3",
    "prettytable>=3.11.0",
    "PyYAML>=6.0.2",
    "pandas>=2.2.3",
    "tqdm>=4.67.1",
    "SQLAlchemy>=2.0.38",
    "appdirs>=1.4.4",
]

[project.optional-dependencies]
pdf = ["reportlab>=4.0.4"]
api = [
    "flask>=3.0.0",
    "flask-caching>=2.3.0",
    "flask-cors>=5.0.0",
    "flask-limiter>=3.11",
    "gunicorn>=23.0.0",
]
lambda = ["boto3>=1.37.18"]
all = [
    "premier_league[pdf,api,lambda]",
]

[project.urls]
Homepage = "https://github.com/kayoMichael/premier_league"
Documentation = "https://kayomichael-premier_league.mintlify.app/introduction"
Repository = "https://github.com/kayoMichael/premier_league"

# Test/lint tooling. Installed automatically by `uv sync`; not shipped to PyPI.
[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-vcr>=1.0.2",
    "vcrpy>=7.0.0",
    "pytest-html>=4.1.1",
    "black>=24.0.0",
    "isort>=5.13.0",
    "pylint>=3.0.0",
    "pre-commit>=3.5.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["premier_league"]

[tool.hatch.build.targets.sdist]
include = [
    "premier_league",
    "README.md",
    "LICENSE.md",
    "DATA_DISCLAIMER.md",
]

[tool.isort]
profile = "black"
